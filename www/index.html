<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vird: aile ibadet takibi</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#142B2A; --ink-2:#5A6F6D; --line:#D9E2DF;
  --cobalt:#1F4F92; --cobalt-soft:#E3EBF6; --turq:#12857D; --fill:#B3E0D8; --brass:#8A6318; --danger:#B2382C;
  --h0:#E8EEEC; --h1:#CBE9E3; --h2:#8FD0C5; --h3:#46AFA2; --h4:#12857D;
  --c-zikir:#1F4F92; --c-kuran:#12857D; --c-ilim:#A8711A; --c-ibadet:#6B4A8B; --c-hayir:#3C7A3E; --c-saglik:#B23A2E; --c-diger:#5A6F6D;
  --hero:#173E73; --hero-ink:#F3F7FA; --hero-2:#C3D3EC; --gold:#E2B85C;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15252C; --surface-2:#1D323A; --ink:#E4EEEC; --ink-2:#98ADAA; --line:#29424B;
    --cobalt:#8BB2EC; --cobalt-soft:#1E3550; --turq:#4DC3B8; --fill:#22615C; --brass:#D9B060; --danger:#EC8072;
    --h0:#1D323A; --h1:#1C4643; --h2:#226A63; --h3:#2E9A8F; --h4:#4DC3B8;
    --c-zikir:#8BB2EC; --c-kuran:#4DC3B8; --c-ilim:#D9B060; --c-ibadet:#B79BDB; --c-hayir:#7FC283; --c-saglik:#EC8072; --c-diger:#98ADAA;
    --hero:#13305A; --hero-ink:#EEF4FA; --hero-2:#AFC3E3; --gold:#E2B85C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15252C; --surface-2:#1D323A; --ink:#E4EEEC; --ink-2:#98ADAA; --line:#29424B;
  --cobalt:#8BB2EC; --cobalt-soft:#1E3550; --turq:#4DC3B8; --fill:#22615C; --brass:#D9B060; --danger:#EC8072;
  --h0:#1D323A; --h1:#1C4643; --h2:#226A63; --h3:#2E9A8F; --h4:#4DC3B8;
    --c-zikir:#8BB2EC; --c-kuran:#4DC3B8; --c-ilim:#D9B060; --c-ibadet:#B79BDB; --c-hayir:#7FC283; --c-saglik:#EC8072; --c-diger:#98ADAA;
    --hero:#13305A; --hero-ink:#EEF4FA; --hero-2:#AFC3E3; --gold:#E2B85C;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 64px);-webkit-text-size-adjust:100%}
html{font-size:calc(100% * var(--fs,1))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.03rem;line-height:1.45}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));background:var(--bg);z-index:35;pointer-events:none}
.appbar{-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.38;cursor:default}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* üst çubuk */
.appbar{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.6rem;line-height:1;color:var(--cobalt);margin:0}
.dates{flex:1;min-width:0;font-size:.82rem;color:var(--ink-2);line-height:1.25}
.dates span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

.app{max-width:600px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card + .card,.card + .group,.group + .group{margin-top:14px}
.card-pad{padding:14px}
.h2{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

.join{border-color:var(--cobalt);margin-bottom:14px}
.join p{margin:.3rem 0 .7rem;font-size:.95rem}
.join-row{display:flex;gap:8px}.join-row input{flex:1}
.note{margin:0 0 14px;font-size:.95rem}

/* kişi seçici */
.people{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:.45rem;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.38rem .85rem .38rem .5rem;font-weight:600;font-size:.95rem;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip .pc{font-weight:400;opacity:.75}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}

/* dönem gezgini */
.pnav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:12px}
.plabel{text-align:center}
.plabel b{display:block;font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1.2}
.plabel small{display:block;color:var(--ink-2);font-size:.85rem;min-height:1.2em}

/* özet */
.sum{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.star{position:relative;display:block;width:96px;aspect-ratio:1}
.star svg{display:block;width:100%;height:100%;overflow:visible}
.s-clip{position:absolute;inset:0}
.s-bg2{position:absolute;inset:0;background:var(--surface-2)}
.s-fill2{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--fill);transition:height .35s ease}
.star svg{position:relative}
.s-line{fill:none;stroke:var(--cobalt);stroke-width:2.6;stroke-linejoin:round;transition:stroke .3s}
.full .s-line{stroke:var(--turq)}
.star .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.sum-who{margin:0;font-size:.85rem;color:var(--ink-2)}
.sum-main{margin:.05rem 0 0;font-family:var(--serif);font-size:1.25rem;font-weight:600;line-height:1.25}
.sum-sub{margin:.25rem 0 0;font-size:.92rem;color:var(--ink-2)}
.sum-sub.streak{color:var(--brass);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--serif);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-2)}

.history{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.h-col{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px}
.h-bar{width:100%;max-width:34px;height:38px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
.h-bar i{display:block;width:100%;background:var(--turq)}
.h-lab{font-size:.74rem;color:var(--ink-2);line-height:1.1;text-align:center}
.h-col[aria-current="true"] .h-bar{outline:2px solid var(--cobalt);outline-offset:1px}
.h-col[aria-current="true"] .h-lab{color:var(--ink);font-weight:700}

/* filtre */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:.32rem .8rem;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* görev grupları */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.g-head{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px 9px;border-bottom:1px solid var(--line);background:var(--surface)}
.g-head .h2{font-size:1.02rem}
.g-head span{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0}
.task{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px 15px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.sub{padding-left:30px;border-top-style:dashed}
.task.sub .t-bar{left:30px}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0}
.t-name{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-name svg{width:14px;height:14px;flex:none;fill:var(--turq)}
.badge{font-size:.72rem;font-weight:600;color:var(--cobalt);background:var(--cobalt-soft);border-radius:6px;padding:1px 6px}
.t-ar{font-family:var(--ar);font-size:1.05rem;color:var(--ink-2);font-weight:400}
.t-val{font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.task.done .t-val{color:var(--turq)}
.task.running .t-val{color:var(--cobalt);font-weight:700}
.t-ctl{display:flex;gap:6px;flex:none}
.t-bar{position:absolute;left:14px;right:14px;bottom:6px;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.t-bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);background:var(--turq);transition:width .25s}
.btn{min-width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 .8rem;font-variant-numeric:tabular-nums}
.btn.plus{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--line)}
.chk[aria-pressed="true"]{background:var(--turq);border-color:var(--turq);color:var(--surface)}
.empty{padding:18px 14px;margin:0;color:var(--ink-2);text-align:center}

/* yıllık */
.heat{display:grid;grid-template-columns:2.1rem repeat(31,1fr);gap:2px;align-items:center}
.heat .ml{font-size:.72rem;color:var(--ink-2)}
.hc{aspect-ratio:1;border-radius:2px;background:var(--h0)}
.hc.x{background:transparent}
.hc.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hc.l1{background:var(--h1)}.hc.l2{background:var(--h2)}.hc.l3{background:var(--h3)}.hc.l4{background:var(--h4)}
.hc.t{outline:1.5px solid var(--cobalt);outline-offset:0}
.hc[data-t]{cursor:pointer}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:.78rem;color:var(--ink-2)}
.legend .hc{width:11px}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;margin-top:12px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px}
.mb .bar{width:100%;height:70px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.mb .bar i{display:block;width:100%;background:var(--cobalt)}
.mb span{font-size:.7rem;color:var(--ink-2)}
.mb.cur span{color:var(--ink);font-weight:700}
.yrow{padding:10px 14px 13px;border-top:1px solid var(--line);position:relative}
.yrow:first-child{border-top:0}
.yrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.yrow b{font-weight:600}
.yrow .rate{font-variant-numeric:tabular-nums;font-weight:700}
.yrow .meta{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.yrow .t-bar{left:14px;right:14px;bottom:5px}

/* aile */
.mcard .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mcard .mh b{font-size:1.05rem}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms{display:flex;flex-direction:column;gap:4px}
.ms span{font-size:.78rem;color:var(--ink-2)}
.ms b{font-family:var(--serif);font-size:1.1rem;font-variant-numeric:tabular-nums}
.ms i{display:block;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.ms i::after{content:"";display:block;height:100%;width:calc(var(--p)*100%);background:var(--turq)}
.matrix-wrap{overflow-x:auto}
.matrix{border-collapse:collapse;width:100%;font-size:.9rem}
.matrix th,.matrix td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.matrix thead th{border-top:0;font-weight:700;color:var(--ink-2);font-size:.82rem}
.matrix td.tn{white-space:normal;min-width:7.5rem}
.cell{display:inline-block;min-width:4.4rem;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--fill) calc(var(--p)*100%),var(--surface-2) calc(var(--p)*100%))}
.cell.ok{font-weight:700}

.esma-all summary{cursor:pointer;padding:12px 14px;font-family:var(--serif);font-size:1.02rem;font-weight:600}
.esma-all ol{margin:0;padding:0 14px 12px 3rem}
.esma-all li{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto;column-gap:10px;align-items:baseline}
.esma-all .em{grid-column:1/-1;font-size:.85rem;color:var(--ink-2);font-weight:400}
.t-mean{display:block;font-size:.84rem;color:var(--ink-2);font-weight:400;line-height:1.3}
.esma-all li.today{color:var(--cobalt);font-weight:700}
.esma-all .ear{font-family:var(--ar);font-size:1.05rem}
.esma-all .eb{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:2.8rem;text-align:right}
.status{margin-top:22px;color:var(--ink-2);font-size:.82rem;text-align:center}

/* alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--ink-2)}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--cobalt)}

/* sayaç */
.zikir{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 12px) 18px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 20px);overflow:auto}
.z-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.z-who{color:var(--ink-2);font-size:.95rem}
.z-name{font-family:var(--serif);font-weight:700;font-size:1.8rem;margin:16px 0 0;color:var(--cobalt);text-align:center}
.z-ar{font-family:var(--ar);font-size:2.1rem;line-height:1.7;margin:2px 0 0;text-align:center}
.z-hint{margin:2px 0 0;color:var(--ink-2);font-size:.92rem;text-align:center}
.z-tap{position:relative;width:min(76vw,330px);aspect-ratio:1;border:0;background:none;padding:0;margin:14px auto 4px;user-select:none;-webkit-user-select:none}
.z-tap .star{width:100%;transition:transform .08s}
.z-tap:active .star{transform:scale(.982)}
.z-tap[aria-disabled="true"]{cursor:default}
.z-count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);pointer-events:none}
.z-num{font-size:clamp(3rem,15vw,4.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.z-of{font-size:1.05rem;color:var(--ink-2)}
.z-msg{min-height:1.5em;margin:6px 0 0;color:var(--turq);font-weight:700;text-align:center}
.z-bottom{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
.z-bottom .btn{height:46px;padding:0 1.1rem}
.complete .z-tap .star{animation:bloom .6s ease}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ayarlar */
.sheet-bg{position:fixed;inset:0;z-index:55;background:rgba(6,22,28,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:620px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:90%;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.sheet-head h2{font-family:var(--serif);font-weight:700;font-size:1.4rem;margin:0}
.sheet-body{overflow:auto;padding:0 18px 16px}
.sheet-body h3{font-family:var(--serif);font-weight:600;font-size:1.08rem;margin:20px 0 8px}
.sheet-foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;height:46px}
.ed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ed-t{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=email],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.42rem .6rem;min-width:0}
.ed-name,.full-w{width:100%}
.ed-row label{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--ink-2)}
.ed-row input[type=number]{width:5rem}
.ed-row .push{margin-left:auto}
.link{border:0;background:none;color:var(--cobalt);font-weight:700;padding:.5rem 0;margin-top:4px}
.ed-note{color:var(--ink-2);font-size:.9rem;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 84px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.95rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* güçlü görünüm */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 16px 14px}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.12;background-size:64px 64px;background-position:center}
.hero .sum{grid-template-columns:112px 1fr}
.hero .star{width:112px}
.hero .s-bg2{background:rgba(255,255,255,.12)}
.hero .s-fill2{background:var(--gold)}
.hero .s-line{stroke:rgba(255,255,255,.9)}
.hero .full .s-line{stroke:var(--gold)}
.hero .pct{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);font-size:1.5rem}
.hero .sum-who{color:var(--hero-2)}
.hero .sum-main{color:#fff;font-size:1.4rem}
.hero .sum-sub{color:var(--hero-2)}
.hero .sum-sub.streak{color:var(--gold)}
.hero .history{border-top-color:rgba(255,255,255,.18)}
.hero .h-bar{background:rgba(255,255,255,.13)}
.hero .h-bar i{background:var(--gold)}
.hero .h-lab{color:var(--hero-2)}
.hero .h-col[aria-current="true"] .h-bar{outline-color:#fff}
.hero .h-col[aria-current="true"] .h-lab{color:#fff}
.hero .stat{background:rgba(255,255,255,.1)}

function tipsFor(d){

function normTasks(ts){
  if(!Array.isArray(ts)) return null;
  return ts.filter(t=>t&&t.id&&t.name&&PNAME[t.period]).map(t=>{ const x=Object.assign({},t);
    if(x.id==='esma'){x.unit='esma';x.target=3;}
    if(x.unit==='namaz'){ x.target=5; }
    if(x.unit==='liste'){ x.target=1; if(!['sabah','aksam','dua'].includes(x.kind)) x.kind=x.id==='aksam_zikir'?'aksam':x.id==='peygamber_dua'?'dua':'sabah'; }
    x.target=Math.max(1,parseInt(x.target,10)||1); if(x.scope!=='aile')x.scope='kisi';
    if(!CATNAME[x.cat]) x.cat=CATMAP[x.id]||'diger'; return x; });
}
const ownerKey=(t,u)=>t.scope==='aile'?'aile':u;
function valsOf(t,u,k){ if(t.scope==='aile') return state.aile[k]||{}; const L=state.logs[u]; return (L&&L[k])||{}; }
const timerOn=(t,u,k,f)=>!!(timer&&timer.tid===t.id&&timer.k===k&&timer.owner===ownerKey(t,u)&&timer.f===f);
const timerVal=()=>timer.base+(Date.now()-timer.start)/1000;
function val(t,u,k,f){ f=f||t.id; let v=+valsOf(t,u,k)[f]||0; if(timerOn(t,u,k,f)) v=Math.min(capOf(t,f),timerVal()); return v; }
function frac(t,u,k,date){
  if(isEsma(t)){ let s=0; for(const i of esmaOfDay(date)) s+=Math.min(1,val(t,u,k,'esma_'+(i+1))/ESMA[i][2]); return s/3; }
  if(isList(t)){ const it=listItems(t,date); let s=0; for(const x of it) s+=Math.min(1,val(t,u,k,'z_'+x.id)/x.rep); return it.length?s/it.length:0; }
  if(isNamaz(t)){ let n=0; for(const x of NAMAZ) if(val(t,u,k,'nm_'+x[0])>=1) n++; return n/5; }
  return Math.min(1,val(t,u,k)/tgt(t));
}
function amount(t,u,k){ if(isNamaz(t)){ let n=0; for(const x of NAMAZ) if(val(t,u,k,'nm_'+x[0])>=1) n++; return n; } if(isList(t)){ let s=0; const v=valsOf(t,u,k); for(const f in v) if(f.indexOf('z_')===0) s+=+v[f]||0; return s; } if(isEsma(t)){ let s=0; const v=valsOf(t,u,k); for(const f in v) if(f.indexOf('esma_')===0) s+=+v[f]||0; return s; } return val(t,u,k); }
function comp(u,p,d){
  const ts=tasksOf(u).filter(t=>t.period===p); if(!ts.length||!u) return {pct:0,done:0,total:0};
  const k=docKey(p,d); let s=0,done=0;
  for(const t of ts){ const f=frac(t,u,k,d); s+=f; if(f>=0.9999)done++; }
  return {pct:s/ts.length,done,total:ts.length};
}
function streak(u){ let d=sod(new Date()),n=0; if(comp(u,'d',d).pct<0.9999)d=addDays(d,-1); for(let i=0;i<800;i++){ if(comp(u,'d',d).pct>=0.9999){n++;d=addDays(d,-1);}else break; } return n; }
function sinceFor(u){
  const m=state.members.find(x=>x.id===u); let s=m&&m.since?sod(new Date(m.since)):null;
  const L=state.logs[u]||{}; for(const k in L) if(k[0]==='d'){ const d=parseIso(k.slice(2)); if(!s||d<s) s=d; }
  return s||sod(new Date());
}

const yCache={};
function yearStats(u,y){
  const ck=u+'|'+y; if(yCache[ck]) return yCache[ck];
  const today=sod(new Date()); let start=new Date(y,0,1),end=new Date(y,11,31);
  const s=sinceFor(u); if(s>start) start=s; if(today<end) end=today;
  const R={y,start,end,empty:start>end,heat:{},tasks:{},months:Array.from({length:12},()=>({s:0,n:0})),sum:0,n:0,fullDays:0,longest:0};
  if(R.empty) return yCache[ck]=R;
  const TS=tasksOf(u); for(const t of TS) R.tasks[t.id]={t,done:0,n:0,fs:0,amt:0};
  const add=(p,d)=>{ const k=docKey(p,d); let ds=0,dn=0;
    for(const t of TS){ if(t.period!==p) continue; const f=frac(t,u,k,d),st=R.tasks[t.id]; st.n++; st.fs+=f; if(f>=0.9999)st.done++; st.amt+=amount(t,u,k); ds+=f; dn++; R.sum+=f; R.n++; const mo=R.months[d.getMonth()]; mo.s+=f; mo.n++; }
    return dn?ds/dn:null; };
  let run=0;
  for(let d=new Date(start);d<=end;d=addDays(d,1)){ const pc=add('d',d); R.heat[iso(d)]=pc==null?0:pc; if(pc!=null&&pc>=0.9999){R.fullDays++;run++;if(run>R.longest)R.longest=run;} else run=0; }
  for(let w=sow(start);w<=end;w=addDays(w,7)){ if(w.getFullYear()<y&&addDays(w,6).getFullYear()<y) continue; add('w',w<start&&w.getFullYear()<y?new Date(y,0,1):w); }
  for(let m=som(start);m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1)) add('m',m);
  R.pct=R.n?R.sum/R.n:0;
  return yCache[ck]=R;
}

const subs={dev:null,person:{},plogs:{},group:{},glogs:{}};
function mapLogs(q){ const L={}; for(const x of q.docs){ const d=x.data()||{},o={}; for(const k in d) o[k]=+d[k]||0; L[x.id]=o; } return L; }
function statusFrom(q){ setStatus(q.metadata&&q.metadata.fromCache?'offline':(q.metadata&&q.metadata.hasPendingWrites?'saving':'synced')); }
function overlayPend(){ for(const pk in store.pend){ const pe=store.pend[pk]; const M=pe.g?(state.glogs[pe.g]||(state.glogs[pe.g]={})):(state.logs[pe.u]||(state.logs[pe.u]={})); M[pe.k]=Object.assign({},M[pe.k]||{},pe.delta); } }
function syncSubs(){
  const wantP=new Set(),wantG=new Set();
  if(ME) wantP.add(ME);
  const mine=(state.people[ME]&&state.people[ME].groups)||[];
  for(const g of mine){ wantG.add(g); const G=state.groups[g]; if(G&&Array.isArray(G.members)) G.members.forEach(p=>wantP.add(p)); }
  for(const p of wantP) if(!subs.person[p]){
    subs.person[p]=db.collection('people').doc(p).onSnapshot(s=>{ if(s.exists) state.people[p]=s.data()||{}; else if(!s.metadata.fromCache) delete state.people[p]; bump(); syncSubs(); afterMembers(); renderSoon(); if(p===ME&&state.joined){ firstReminders(); addNewTasksOnce(); } },e=>console.warn('kişi',p,e));
    subs.plogs[p]=db.collection('people').doc(p).collection('logs').onSnapshot({includeMetadataChanges:true},q=>{ state.logs[p]=mapLogs(q); overlayPend(); statusFrom(q); renderSoon(); },e=>console.warn('kayıt',p,e));
  }
  for(const g of wantG) if(!subs.group[g]){
    subs.group[g]=db.collection('groups').doc(g).onSnapshot(s=>{ if(s.exists) state.groups[g]=s.data()||{}; else if(!s.metadata.fromCache) delete state.groups[g]; bump(); syncSubs(); afterMembers(); renderSoon(); },e=>console.warn('grup',g,e));
    subs.glogs[g]=db.collection('groups').doc(g).collection('logs').onSnapshot({includeMetadataChanges:true},q=>{ state.glogs[g]=mapLogs(q); overlayPend(); statusFrom(q); renderSoon(); },e=>console.warn('grup kaydı',g,e));
  }
  for(const p in subs.person) if(!wantP.has(p)){ subs.person[p](); subs.plogs[p](); delete subs.person[p]; delete subs.plogs[p]; delete state.people[p]; delete state.logs[p]; }
  for(const g in subs.group) if(!wantG.has(g)){ subs.group[g](); subs.glogs[g](); delete subs.group[g]; delete subs.glogs[g]; delete state.groups[g]; delete state.glogs[g]; }
  if(state.gidHold&&mine.includes(state.gidHold)) state.gidHold=null;
  if(state.people[ME]){ if(GID&&!mine.includes(GID)&&GID!==state.gidHold){ GID=mine[0]||''; lsSet('vird:gid',GID||null); bump(); } if(!GID&&mine.length){ GID=mine[0]; lsSet('vird:gid',GID); bump(); } }
}
let rsT=0; function renderSoon(){ if(rsT) return; rsT=(window.requestAnimationFrame||setTimeout)(()=>{ rsT=0; render(); }); }
function stopAll(){
  try{ subs.dev&&subs.dev(); }catch(e){} subs.dev=null;
  for(const k of ['person','plogs','group','glogs']){ for(const id in subs[k]){ try{ subs[k][id](); }catch(e){} } subs[k]={}; }
}
function subscribeRoot(){

    syncSubs(); afterMembers(); renderSoon();
  },onErr);
}

/* yazma */
function setVal(t,u,k,f,n){
  if(!canEditTask(t,u)) return;
  n=Math.max(0,Math.min(capOf(t,f),Math.floor(n)));
  const shared=t.scope==='aile'; if(shared&&!GID) return;
  const M=shared?(state.glogs[GID]||(state.glogs[GID]={})):(state.logs[u]||(state.logs[u]={}));
  (M[k]||(M[k]={}))[f]=n;
  const pk=(shared?'g:'+GID:'p:'+u)+'|'+k,pe=store.pend[pk]||(store.pend[pk]={g:shared?GID:null,u:shared?null:u,k,delta:{}});
  pe.delta[f]=n; scheduleFlush();
}
function scheduleFlush(){ clearTimeout(store.ft); setStatus('saving'); store.ft=setTimeout(flush,600); }
const anyPending=()=>Object.keys(store.pend).length>0;
function flush(){
  const items=Object.values(store.pend); if(!items.length||!db) return;
  const b=db.batch();
  for(const it of items){ const ref=it.g?db.collection('groups').doc(it.g).collection('logs').doc(it.k):db.collection('people').doc(it.u).collection('logs').doc(it.k); b.set(ref,it.delta,{merge:true}); }
  store.pend={};
  b.commit().then(()=>setStatus('synced')).catch(e=>{ console.warn(e); setStatus('error'); toast('Kayıt gönderilemedi.'); });
}

  ME=p.id; lsSet('vird:me',ME); gate={mode:'ready'}; state.view=ME; subscribeRoot();
}
async function createGroup(name,type){
  const g=db.collection('groups').doc(),b=db.batch(),now=Date.now();
  b.set(g,{name,type,owner:ME,created:now,members:[ME],names:{[ME]:myName()},tasks:type==='aile'?clone(DEF_GROUP_AILE):[]});
  b.update(db.collection('people').doc(ME),{groups:FV().arrayUnion(g.id)});
  state.gidHold=g.id; await b.commit(); GID=g.id; lsSet('vird:gid',GID); bump(); syncSubs(); afterMembers(); render();

async function inviteInfo(t){ const s=await db.collection('invites').doc(t).get(); if(!s.exists) throw new Error('yok'); const d=s.data()||{}; if((+d.exp||0)<Date.now()) throw new Error('süre'); return d; }
async function handleToken(t){
  if(!db||!UID){ gate.pendingInvite=t; return; }
  let inv; try{ inv=await inviteInfo(t); }catch(e){ toast('Davet linki geçersiz ya da süresi dolmuş.'); if(!ME){ gate={mode:'welcome',err:'Davet linki geçersiz ya da süresi dolmuş. Yeni bir davet iste.'}; render(); } return; }
  if(ME&&state.people[ME]){
    if(((state.people[ME].groups)||[]).includes(inv.gid)){ GID=inv.gid; lsSet('vird:gid',GID); bump(); afterMembers(); render(); toast('Zaten “'+(inv.gname||'bu')+'” grubundasın.'); return; }
    state.offer={t,inv}; render(); return;
  }
  // yeni telefon: önce katılım kaydı, sonra "sen kimsin?"
  gate={mode:'join'}; render();
  try{
    await db.collection('groups').doc(inv.gid).collection('joins').doc(UID).set({invite:t,at:Date.now()});
    const gs=await db.collection('groups').doc(inv.gid).get(); const G=gs.data()||{};
    gate={mode:'pick',t,inv,names:G.names||{}};
  }catch(e){ console.warn(e); gate={mode:'welcome',err:'Gruba katılınamadı. İnternetini kontrol edip linke tekrar dokun.'}; }
  render();
}
async function acceptOffer(){

  catch(e){ console.warn(e); toast('Katılınamadı. İnternetini kontrol et.'); }
  render();
}

async function sendInvite(){
  const G=state.groups[GID]; if(!G){ toast('Önce bir grup oluştur.'); return; }
  try{
    const ref=db.collection('invites').doc();
    await Promise.race([ref.set({gid:GID,gname:G.name||'',gtype:G.type||'ozel',by:myName(),created:Date.now(),exp:Date.now()+30*864e5}),sleep(4000)]);
    const link=(DAVET_URL||'vird://davet')+'?t='+ref.id,text=(myName()?myName()+' seni ':'')+'Vird’de “'+(G.name||'grup')+'” grubuna davet ediyor: '+link;
    const S=Plug('Share');

async function scheduleReminders(ask){
  const LN=Plug('LocalNotifications'); if(!LN){ state.notif='yok'; return; }
  try{
    let p=await LN.checkPermissions(); if(p.display!=='granted'&&ask) p=await LN.requestPermissions();
    state.notif=p.display; if(p.display!=='granted') return;
    const pend=await LN.getPending(); if(pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[],now=Date.now(),ic={smallIcon:'ic_stat_vird',iconColor:'#173E73'};
    // her gün tekrarlayanlar
    for(const r of REM) if(r.en&&!r.days.length) list.push(Object.assign({id:r.id*10,title:'Vird: '+r.t,body:r.b,schedule:{on:{hour:r.h,minute:r.m},allowWhileIdle:true}},ic));
    // tarihe bağlı olanlar: önümüzdeki 14 gün (uygulama her açıldığında yenilenir)
    const today=sod(new Date());
    for(let i=0;i<14;i++){
      const d=addDays(today,i),wd=d.getDay()+1;
      for(const r of REM){
        if(!r.en||!r.days.length) continue;
        const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),r.h,r.m); if(+at<=now) continue;
        let title='Vird: '+r.t,body=r.b;
        if(r.id===4){
          const tm=addDays(d,1),h=hijri(tm),twd=tm.getDay();
          const yasak=h&&((h.month===10&&h.day===1)||(h.month===12&&h.day>=10&&h.day<=13));
          if(yasak||(h&&h.month===9)) continue;
          const pp=twd===1||twd===4,bz=!!(h&&h.day>=13&&h.day<=15);
          if(!pp&&!bz) continue;
          title='Vird: Yarın sünnet oruç günü';
          body='Yarın '+(pp?(twd===1?'Pazartesi':'Perşembe'):'')+(pp&&bz?', ayrıca ':'')+(bz?'Eyyâm-ı bîz ('+h.day+'. gün)':'')+'. Niyet etmeyi ve sahura kalkmayı unutma.';
        } else if(!r.days.includes(wd)) continue;
        list.push(Object.assign({id:3000+i*10+r.id,title,body,schedule:{at,allowWhileIdle:true}},ic));
      }
      if(vkNotify()&&VKT&&VKT.key===vkKey()){
        const day=vkDay(d);
        if(day) VAKIT_BILDIRIM.forEach((k,vi)=>{
          if(!VK.sel[k]) return; const hm2=String(day[k]||'').split(':').map(Number); if(hm2.length!==2||isNaN(hm2[0])||isNaN(hm2[1])) return;
          const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hm2[0],hm2[1]-VK.off); if(+at<=now) return;
          const nm=k==='ogle'&&d.getDay()===5?'Cuma (öğle)':VAKITN[k];
          list.push(Object.assign({id:5000+i*10+vi,title:nm+' vaktine '+VK.off+' dakika kaldı',body:nm+' vakti '+day[k]+' saatinde giriyor ('+vkLabel()+').',schedule:{at,allowWhileIdle:true}},ic));
        });
      }
    }
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){ console.warn(e); }
}

const ayetSt={};
function dayN(d){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function ayahNo(d){ return ((dayN(d)*7919)%6236+6236)%6236+1; }
async function loadAyet(d){
  const key=iso(d); if(ayetSt[key]) return;
  try{ const c=JSON.parse(lsGet('vird:ayet:'+key)||'null'); if(c&&c.tr){ ayetSt[key]=c; return; } }catch(e){}
  ayetSt[key]='loading';
  let no=ayahNo(d);
  for(let i=0;i<5;i++){
    let j=null;
    for(const ed of ['tr.diyanet','tr.vakfi']){ try{ const r=await fetch('https://api.alquran.cloud/v1/ayah/'+no+'/editions/quran-uthmani,'+ed); j=await r.json(); if(j&&j.code===200&&Array.isArray(j.data)&&j.data.length>=2) break; j=null; }catch(e){ j=null; } }
    if(!j){ ayetSt[key]='err'; render(); return; }
    const A=j.data[0],T=j.data[1],len=String(T.text||'').length;
    if(len<60||len>650||A.numberInSurah===1){ no=no%6236+1; continue; }
    const v={ar:A.text,tr:T.text,s:A.surah&&A.surah.number,a:A.numberInSurah,ed:(T.edition&&T.edition.identifier)||''};
    ayetSt[key]=v; lsSet('vird:ayet:'+key,JSON.stringify(v)); render(); return;
  }
  ayetSt[key]='err'; render();
}
function dailyHTML(d,compact){
  const key=iso(d),A=ayetSt[key]; if(!A) loadAyet(d);

  else a='<p class="d-tr muted">Yükleniyor…</p>';
  if(A==='err'&&!ayetSt['_t'+key]){ ayetSt['_t'+key]=1; setTimeout(()=>{ delete ayetSt[key]; delete ayetSt['_t'+key]; },60000); }

function heatLevel(f){ return f>=0.9999?'l4':f>=0.67?'l3':f>=0.34?'l2':f>0?'l1':''; }
function rangeStats(u,start,end){
  const R={tasks:{},cats:{},sum:0,n:0}; if(start>end) return R;
  const TS=tasksOf(u); for(const t of TS) R.tasks[t.id]={t,done:0,n:0,fs:0,amt:0};
  const add=(p,d)=>{ const k=docKey(p,d); for(const t of TS){ if(t.period!==p) continue; const f=frac(t,u,k,d),st=R.tasks[t.id]; st.n++; st.fs+=f; if(f>=0.9999) st.done++; st.amt+=amount(t,u,k); R.sum+=f; R.n++; const c=R.cats[t.cat]||(R.cats[t.cat]={s:0,n:0}); c.s+=f; c.n++; } };
  for(let d=new Date(start);d<=end;d=addDays(d,1)) add('d',d);
  for(let w=sow(start);w<=end;w=addDays(w,7)) add('w',w);
  for(let m=som(start);m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1)) add('m',m);
  R.pct=R.n?R.sum/R.n:0; return R;
}

let MMAP=null,MEAL=null,MEALIX=null,mmBusy=null;
async function quranData(){
  if(MMAP&&MEAL) return true;
  if(!mmBusy) mmBusy=(async()=>{
    const [a,b]=await Promise.all([fetch('data/mushaf.json').then(r=>r.json()),fetch('data/meal.json').then(r=>r.json())]);
    if(!a||!Array.isArray(a.pages)||!Array.isArray(a.cnt)||!b||!Array.isArray(b.m)) throw new Error('Kur\'an verisi bozuk');
    MMAP=a; MEAL=b.m; MEALIX={}; MEAL.forEach((r,i)=>{ for(const n of r[1]) MEALIX[r[0]+':'+n]=i; });
    setTimeout(()=>{ renderSoon(); if(rd) renderReader(); if(dz.on) renderDers(); },0);
    return true;

  return mmBusy;
}
function qMeal(refs){
  if(!MEALIX||!MMAP||!MMAP.cnt) return null; const out=[],seen=new Set();
  for(const r of refs){ let s,a1,a2;
    if(String(r).indexOf(':')>0){ [s,a1]=String(r).split(':').map(Number); a2=a1; } else { s=+r; a1=1; a2=MMAP.cnt[s-1]; }
    for(let a=a1;a<=a2;a++){ const i=MEALIX[s+':'+a]; if(i==null) return null; if(seen.has(i)) continue; seen.add(i); const g=MEAL[i];
      out.push((refs.length>1||String(r).indexOf(':')<0||g[1].length>1?'('+g[1].join(', ')+') ':'')+g[2]); } }
  return out.join(' ');
}

  if(!resp){ try{ const r=await fetch(url,{mode:'cors'}); if(r.ok) resp=r; }catch(e){} }

/* okuma ekranı: sabah/akşam zikirleri ve dualar */
const qMem={};
/* Türkiye mushaf yazım usulü: vasla işareti gösterilmez, kelime başındaki (و ف ب ل önekinden sonra da) elifin üzerinde hemze işareti yazılmaz, cezm yuvarlak yazılır. Harfler ve harekeler aynen korunur. */
const trM=x=>String(x||'').replace(/\u0671/g,'\u0627').replace(/(^|[\s\u00A0(])([\u0648\u0641\u0628\u0644][\u064E\u0650]?)?[\u0623\u0625]/g,(m,p,q)=>p+(q||'')+'\u0627').replace(/\u06E1/g,'\u0652');
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function qCached(refs){ const k=refs.join('|'); if(qMem[k]) return qMem[k]; try{ const c=JSON.parse(lsGet('vird:q:'+k)||'null'); if(c&&c.ar) return qMem[k]=c; }catch(e){} return null; }
async function qFetch(path){ for(const ed of ['tr.diyanet','tr.vakfi']){ try{ const j=await httpGet('https://api.alquran.cloud/v1'+path+'/editions/quran-uthmani,'+ed); if(j&&j.code===200&&Array.isArray(j.data)&&j.data.length>=2) return {j,ed}; }catch(e){} } throw new Error('yüklenemedi'); }
const qBusy={},qFail={};
async function qLoad(refs){
  const k=refs.join('|'); if(qCached(refs)||qBusy[k]||(qFail[k]&&Date.now()-qFail[k]<30000)) return; qBusy[k]=1;
  try{
    const ar=[],tr=[]; let bes='',ed='tr.diyanet';
    for(const r of refs){
      if(r.indexOf(':')>0){ const {j,ed:e}=await qFetch('/ayah/'+r); ed=e; const n=j.data[0].numberInSurah; ar.push(j.data[0].text+' ﴿'+arNum(n)+'﴾'); tr.push((refs.length>1?'('+n+') ':'')+j.data[1].text); }
      else { const {j,ed:e}=await qFetch('/surah/'+r); ed=e; const A=j.data[0].ayahs||[],T=j.data[1].ayahs||[];
        A.forEach((a,i)=>{ let x=String(a.text||''); if(i===0&&+r!==1&&+r!==9){ const w=x.split(' '); if(w[0]&&w[0].indexOf('بِسْمِ')===0){ bes=w.slice(0,4).join(' '); x=w.slice(4).join(' '); } } ar.push(x+' ﴿'+arNum(a.numberInSurah)+'﴾'); tr.push('('+a.numberInSurah+') '+((T[i]||{}).text||'')); }); }
    }
    const v={ar:ar.join(' '),tr:tr.join(' '),bes,ed}; qMem[k]=v; lsSet('vird:q:'+k,JSON.stringify(v));
  }catch(e){ console.warn(e); qFail[k]=Date.now(); }
  delete qBusy[k]; if(rd) renderReader(); if(typeof dz!=='undefined'&&dz.on) renderDers();
}

  rd={tid,u:state.view,k:docKey(period(),state.cursor),d:state.cursor};

function onDraft(e){
  const el=e.target; if(!draft) return;
  if(el.id==='myName'){ draft.myname=el.value; return; }
  const v=draft.vk;
  if(el.id==='vkEn'){ if(e.type!=='change') return; v.en=el.checked; renderSheet(); return; }
  if(el.id==='vkOff'){ v.off=+el.value||30; return; }
  if(el.dataset.vks){ v.sel[el.dataset.vks]=el.checked; return; }
  if(el.dataset.vadj){ if(e.type!=='change') return; const b=vkBase(sod(new Date())); if(!b) return; const k=el.dataset.vadj,dd=hmDiff(el.value,b[k]); v.adj=Object.assign({},v.adj,{[k]:Math.max(-30,Math.min(30,dd))}); renderSheet(); return; }
  if(el.id==='vkIl'){ if(e.type!=='change') return; v.adj={}; v.il=el.value; v.ilce=ilIlceleri(v.il).length===1?ilIlceleri(v.il)[0]:''; renderSheet(); return; }
  if(el.id==='vkIlce'){ if(e.type!=='change') return; v.adj={}; v.ilce=el.value; renderSheet(); return; }
  if(el.id==='gNameEd'){ draft.gname=el.value; return; }
  if(el.dataset.ri!==undefined){ const r=draft.rem[+el.dataset.ri]; if(!r) return; if(el.dataset.f==='en') r.en=el.checked; else { const a=String(el.value||'').split(':').map(Number); if(a.length===2&&!isNaN(a[0])&&!isNaN(a[1])){ r.h=a[0]; r.m=a[1]; } } return; }
  if(el.dataset.mi!==undefined){ const m=draft.managed[+el.dataset.mi]; if(m) m.name=el.value; return; }
  if(el.dataset.ti!==undefined){ const arr=el.dataset.l==='g'?draft.gt:draft.pt,t=arr&&arr[+el.dataset.ti]; if(!t) return; const f=el.dataset.f;
    if(f==='name')t.name=el.value; else if(f==='target')t.target=el.value; else if(f==='unit')t.unit=el.value; else if(f==='cat')t.cat=el.value; }
}

  else if(a==='goedit'){ closeSettings(); state.tab=state.per='d'; state.cursor=sod(new Date()); state.view=ME; state.editMode=true; savePrefs(); render(); window.scrollTo(0,0); enterAnim(); }
  else if(a==='kick') armConfirm(b,'Emin misin?',()=>{ const m=draft.managed.splice(+b.dataset.mi,1)[0]; if(m) removeManaged(m.id).catch(()=>toast('Çıkarılamadı.')); renderSheet(); });
  else if(a==='leave') armConfirm(b,'Gruptan ayrılsın mı? Tekrar dokun',()=>{ const g=GID; closeSettings(); leaveGroup(g).then(()=>toast('Gruptan ayrıldın.')).catch(()=>toast('Ayrılınamadı.')); });
  else if(a==='wipe') armConfirm(b,'Kalıcı olarak silinsin mi? Tekrar dokun',()=>{ closeSettings(); deleteMyData(); });
});
$('sheetSave').addEventListener('click',()=>{
  if(!draft||!db) return; const d=draft; closeSettings();
  const oldKey=vkKey(); VK=Object.assign({},d.vk); vkSave();
  REM=d.rem; remSave(); scheduleReminders(false);
  if(VK.il&&VK.ilce) ensureVakitler(vkKey()!==oldKey); else if(VK.en) toast('Namaz vakitleri için il ve ilçe seç.');
  const clean=arr=>normTasks(arr.map(t=>Object.assign({},t,{name:String(t.name).trim()})))||[];
  const b=db.batch(); let n=0;
  const pt=clean(d.pt).map(t=>Object.assign(t,{scope:'kisi'}));
  if(JSON.stringify(pt)!==JSON.stringify(personalTasks(ME))){ b.update(db.collection('people').doc(ME),{tasks:pt}); n++; }
  const nm=String(d.myname||'').trim().slice(0,30);
  if(nm&&nm!==myName()){ b.update(db.collection('people').doc(ME),{name:nm}); for(const g of myGroups()) b.update(db.collection('groups').doc(g),{['names.'+ME]:nm}); n++; }
  if(d.gt&&GID){
    const gt=clean(d.gt).map(t=>Object.assign(t,{scope:'aile'}));
    if(JSON.stringify(gt)!==JSON.stringify(groupTasks(GID))){ b.update(db.collection('groups').doc(GID),{tasks:gt}); n++; }
    const gn=String(d.gname||'').trim().slice(0,40); if(gn&&gn!==String(state.groups[GID].name||'')){ b.update(db.collection('groups').doc(GID),{name:gn}); n++; }
  }
  for(const m of d.managed){ const o=state.people[m.id],nn=String(m.name||'').trim().slice(0,30); if(o&&nn&&nn!==o.name){ b.update(db.collection('people').doc(m.id),{name:nn}); n++; } }
  if(n) b.commit().catch(e=>{ console.warn(e); toast('Ayarlar gönderilemedi.'); });
  render(); toast('Kaydedildi.');
});
$('sheetCancel').addEventListener('click',closeSettings);
$('sheetX').addEventListener('click',closeSettings);
$('sheetBg').addEventListener('click',closeSettings);
$('btnSettings').addEventListener('click',openSettings);
$('zBottom').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='zIn'){ e.preventDefault(); const b=$('zBottom').querySelector('[data-z="setm"]'); if(b) b.click(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(dz.on) closeDers(); else if(mp.on) closeMushaf(); else if(kb.on) closeKible(); else if(rd) closeReader(); else if(ted) closeTaskEditor(); else if(!$('sheet').hidden) closeSettings(); else if(cs) closeCounter(); } });

init();
})();
</script>
