<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vird: aile ibadet takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#142B2A; --ink-2:#5A6F6D; --line:#D9E2DF;
  --cobalt:#1F4F92; --cobalt-soft:#E3EBF6; --turq:#12857D; --fill:#B3E0D8; --brass:#8A6318; --danger:#B2382C;
  --h0:#E8EEEC; --h1:#CBE9E3; --h2:#8FD0C5; --h3:#46AFA2; --h4:#12857D;
  --c-zikir:#1F4F92; --c-kuran:#12857D; --c-ilim:#A8711A; --c-ibadet:#6B4A8B; --c-hayir:#3C7A3E; --c-saglik:#B23A2E; --c-diger:#5A6F6D;
  --hero:#173E73; --hero-ink:#F3F7FA; --hero-2:#C3D3EC; --gold:#E2B85C;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15252C; --surface-2:#1D323A; --ink:#E4EEEC; --ink-2:#98ADAA; --line:#29424B;
    --cobalt:#8BB2EC; --cobalt-soft:#1E3550; --turq:#4DC3B8; --fill:#22615C; --brass:#D9B060; --danger:#EC8072;
    --h0:#1D323A; --h1:#1C4643; --h2:#226A63; --h3:#2E9A8F; --h4:#4DC3B8;
    --c-zikir:#8BB2EC; --c-kuran:#4DC3B8; --c-ilim:#D9B060; --c-ibadet:#B79BDB; --c-hayir:#7FC283; --c-saglik:#EC8072; --c-diger:#98ADAA;
    --hero:#13305A; --hero-ink:#EEF4FA; --hero-2:#AFC3E3; --gold:#E2B85C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15252C; --surface-2:#1D323A; --ink:#E4EEEC; --ink-2:#98ADAA; --line:#29424B;
  --cobalt:#8BB2EC; --cobalt-soft:#1E3550; --turq:#4DC3B8; --fill:#22615C; --brass:#D9B060; --danger:#EC8072;
  --h0:#1D323A; --h1:#1C4643; --h2:#226A63; --h3:#2E9A8F; --h4:#4DC3B8;
    --c-zikir:#8BB2EC; --c-kuran:#4DC3B8; --c-ilim:#D9B060; --c-ibadet:#B79BDB; --c-hayir:#7FC283; --c-saglik:#EC8072; --c-diger:#98ADAA;
    --hero:#13305A; --hero-ink:#EEF4FA; --hero-2:#AFC3E3; --gold:#E2B85C;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.45}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));background:var(--bg);z-index:35;pointer-events:none}
.appbar{-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.38;cursor:default}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* üst çubuk */
.appbar{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.6rem;line-height:1;color:var(--cobalt);margin:0}
.dates{flex:1;min-width:0;font-size:.82rem;color:var(--ink-2);line-height:1.25}
.dates span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

.app{max-width:600px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card + .card,.card + .group,.group + .group{margin-top:14px}
.card-pad{padding:14px}
.h2{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

.join{border-color:var(--cobalt);margin-bottom:14px}
.join p{margin:.3rem 0 .7rem;font-size:.95rem}
.join-row{display:flex;gap:8px}.join-row input{flex:1}
.note{margin:0 0 14px;font-size:.95rem}

/* kişi seçici */
.people{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:.45rem;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.38rem .85rem .38rem .5rem;font-weight:600;font-size:.95rem;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip .pc{font-weight:400;opacity:.75}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}

/* dönem gezgini */
.pnav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:12px}
.plabel{text-align:center}
.plabel b{display:block;font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1.2}
.plabel small{display:block;color:var(--ink-2);font-size:.85rem;min-height:1.2em}

/* özet */
.sum{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.star{position:relative;display:block;width:96px;aspect-ratio:1}
.star svg{display:block;width:100%;height:100%;overflow:visible}
.s-bg{fill:var(--surface-2)}
.s-fill{fill:var(--fill);transition:transform .35s ease}
.s-line{fill:none;stroke:var(--cobalt);stroke-width:2.6;stroke-linejoin:round;transition:stroke .3s}
.full .s-line{stroke:var(--turq)}
.star .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.sum-who{margin:0;font-size:.85rem;color:var(--ink-2)}
.sum-main{margin:.05rem 0 0;font-family:var(--serif);font-size:1.25rem;font-weight:600;line-height:1.25}
.sum-sub{margin:.25rem 0 0;font-size:.92rem;color:var(--ink-2)}
.sum-sub.streak{color:var(--brass);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--serif);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-2)}

.history{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.h-col{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:8px}
.h-bar{width:100%;max-width:34px;height:38px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
.h-bar i{display:block;width:100%;background:var(--turq)}
.h-lab{font-size:.74rem;color:var(--ink-2);line-height:1.1;text-align:center}
.h-col[aria-current="true"] .h-bar{outline:2px solid var(--cobalt);outline-offset:1px}
.h-col[aria-current="true"] .h-lab{color:var(--ink);font-weight:700}

/* filtre */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:.32rem .8rem;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* görev grupları */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.g-head{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px 9px;border-bottom:1px solid var(--line);background:var(--surface)}
.g-head .h2{font-size:1.02rem}
.g-head span{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0}
.task{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px 15px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.sub{padding-left:30px;border-top-style:dashed}
.task.sub .t-bar{left:30px}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0}
.t-name{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-name svg{width:14px;height:14px;flex:none;fill:var(--turq)}
.badge{font-size:.72rem;font-weight:600;color:var(--cobalt);background:var(--cobalt-soft);border-radius:6px;padding:1px 6px}
.t-ar{font-family:var(--ar);font-size:1.05rem;color:var(--ink-2);font-weight:400}
.t-val{font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.task.done .t-val{color:var(--turq)}
.task.running .t-val{color:var(--cobalt);font-weight:700}
.t-ctl{display:flex;gap:6px;flex:none}
.t-bar{position:absolute;left:14px;right:14px;bottom:6px;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.t-bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);background:var(--turq);transition:width .25s}
.btn{min-width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 .8rem;font-variant-numeric:tabular-nums}
.btn.plus{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--line)}
.chk[aria-pressed="true"]{background:var(--turq);border-color:var(--turq);color:var(--surface)}
.empty{padding:18px 14px;margin:0;color:var(--ink-2);text-align:center}

/* yıllık */
.heat{display:grid;grid-template-columns:2.1rem repeat(31,1fr);gap:2px;align-items:center}
.heat .ml{font-size:.72rem;color:var(--ink-2)}
.hc{aspect-ratio:1;border-radius:2px;background:var(--h0)}
.hc.x{background:transparent}
.hc.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hc.l1{background:var(--h1)}.hc.l2{background:var(--h2)}.hc.l3{background:var(--h3)}.hc.l4{background:var(--h4)}
.hc.t{outline:1.5px solid var(--cobalt);outline-offset:0}
.hc[data-t]{cursor:pointer}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:.78rem;color:var(--ink-2)}
.legend .hc{width:11px}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;margin-top:12px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px}
.mb .bar{width:100%;height:70px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.mb .bar i{display:block;width:100%;background:var(--cobalt)}
.mb span{font-size:.7rem;color:var(--ink-2)}
.mb.cur span{color:var(--ink);font-weight:700}
.yrow{padding:10px 14px 13px;border-top:1px solid var(--line);position:relative}
.yrow:first-child{border-top:0}
.yrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.yrow b{font-weight:600}
.yrow .rate{font-variant-numeric:tabular-nums;font-weight:700}
.yrow .meta{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.yrow .t-bar{left:14px;right:14px;bottom:5px}

/* aile */
.mcard .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mcard .mh b{font-size:1.05rem}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms{display:flex;flex-direction:column;gap:4px}
.ms span{font-size:.78rem;color:var(--ink-2)}
.ms b{font-family:var(--serif);font-size:1.1rem;font-variant-numeric:tabular-nums}
.ms i{display:block;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.ms i::after{content:"";display:block;height:100%;width:calc(var(--p)*100%);background:var(--turq)}
.matrix-wrap{overflow-x:auto}
.matrix{border-collapse:collapse;width:100%;font-size:.9rem}
.matrix th,.matrix td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.matrix thead th{border-top:0;font-weight:700;color:var(--ink-2);font-size:.82rem}
.matrix td.tn{white-space:normal;min-width:7.5rem}
.cell{display:inline-block;min-width:4.4rem;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--fill) calc(var(--p)*100%),var(--surface-2) calc(var(--p)*100%))}
.cell.ok{font-weight:700}

.esma-all summary{cursor:pointer;padding:12px 14px;font-family:var(--serif);font-size:1.02rem;font-weight:600}
.esma-all ol{margin:0;padding:0 14px 12px 3rem}
.esma-all li{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto;column-gap:10px;align-items:baseline}
.esma-all .em{grid-column:1/-1;font-size:.85rem;color:var(--ink-2);font-weight:400}
.t-mean{display:block;font-size:.84rem;color:var(--ink-2);font-weight:400;line-height:1.3}
.esma-all li.today{color:var(--cobalt);font-weight:700}
.esma-all .ear{font-family:var(--ar);font-size:1.05rem}
.esma-all .eb{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:2.8rem;text-align:right}
.status{margin-top:22px;color:var(--ink-2);font-size:.82rem;text-align:center}

/* alt menü */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--ink-2)}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--cobalt)}

/* sayaç */
.zikir{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 12px) 18px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 20px);overflow:auto}
.z-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.z-who{color:var(--ink-2);font-size:.95rem}
.z-name{font-family:var(--serif);font-weight:700;font-size:1.8rem;margin:16px 0 0;color:var(--cobalt);text-align:center}
.z-ar{font-family:var(--ar);font-size:2.1rem;line-height:1.7;margin:2px 0 0;text-align:center}
.z-hint{margin:2px 0 0;color:var(--ink-2);font-size:.92rem;text-align:center}
.z-tap{position:relative;width:min(76vw,330px);aspect-ratio:1;border:0;background:none;padding:0;margin:14px auto 4px;user-select:none;-webkit-user-select:none}
.z-tap .star{width:100%;transition:transform .08s}
.z-tap:active .star{transform:scale(.982)}
.z-tap[aria-disabled="true"]{cursor:default}
.z-count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);pointer-events:none}
.z-num{font-size:clamp(3rem,15vw,4.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.z-of{font-size:1.05rem;color:var(--ink-2)}
.z-msg{min-height:1.5em;margin:6px 0 0;color:var(--turq);font-weight:700;text-align:center}
.z-bottom{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
.z-bottom .btn{height:46px;padding:0 1.1rem}
.complete .z-tap .star{animation:bloom .6s ease}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ayarlar */
.sheet-bg{position:fixed;inset:0;z-index:55;background:rgba(6,22,28,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:620px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:90%;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.sheet-head h2{font-family:var(--serif);font-weight:700;font-size:1.4rem;margin:0}
.sheet-body{overflow:auto;padding:0 18px 16px}
.sheet-body h3{font-family:var(--serif);font-weight:600;font-size:1.08rem;margin:20px 0 8px}
.sheet-foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;height:46px}
.ed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ed-t{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=email],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.42rem .6rem;min-width:0}
.ed-name,.full-w{width:100%}
.ed-row label{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--ink-2)}
.ed-row input[type=number]{width:5rem}
.ed-row .push{margin-left:auto}
.link{border:0;background:none;color:var(--cobalt);font-weight:700;padding:.5rem 0;margin-top:4px}
.ed-note{color:var(--ink-2);font-size:.9rem;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 84px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.95rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* güçlü görünüm */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 16px 14px}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.12;background-size:64px 64px;background-position:center}
.hero .sum{grid-template-columns:112px 1fr}
.hero .star{width:112px}
.hero .s-bg{fill:rgba(255,255,255,.12)}
.hero .s-fill{fill:var(--gold)}
.hero .s-line{stroke:rgba(255,255,255,.9)}
.hero .full .s-line{stroke:var(--gold)}
.hero .pct{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);font-size:1.5rem}
.hero .sum-who{color:var(--hero-2)}
.hero .sum-main{color:#fff;font-size:1.4rem}
.hero .sum-sub{color:var(--hero-2)}
.hero .sum-sub.streak{color:var(--gold)}
.hero .history{border-top-color:rgba(255,255,255,.18)}
.hero .h-bar{background:rgba(255,255,255,.13)}
.hero .h-bar i{background:var(--gold)}
.hero .h-lab{color:var(--hero-2)}
.hero .h-col[aria-current="true"] .h-bar{outline-color:#fff}
.hero .h-col[aria-current="true"] .h-lab{color:#fff}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
const CATS=[['zikir','Zikir'],['kuran',"Kur'an"],['ilim','İlim'],['ibadet','İbadet'],['hayir','Hayır'],['saglik','Sağlık'],['diger','Diğer']];
const CATNAME=Object.fromEntries(CATS);
const CATMAP={istigfar:'zikir',hamdele:'zikir',salavat:'zikir',esma:'zikir',tefekkur:'zikir',kuran_ortak:'kuran',kuran:'kuran',tefsir:'kuran',ezber:'kuran',hadis:'ilim',arapca:'ilim',aile_dersi:'ilim',derse_gitmek:'ilim',online_ders:'ilim',ders_serisi:'ilim',kitap:'ilim',kusluk:'ibadet',teheccud:'ibadet',oruc:'ibadet',cami:'ibadet',sadaka:'hayir',zekat:'hayir',fidan:'hayir',yetim:'hayir',spor:'saglik'};

const PNAME={d:'Günlük',w:'Haftalık',m:'Aylık'};
const PUNIT={d:'gün',w:'hafta',m:'ay'};
const WD=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const UNITS=[['adet','adet'],['sayfa','sayfa'],['bölüm','bölüm'],['ders','ders'],['dk','dakika'],['kez','kez'],['gün','gün']];

/* yardımcılar */
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const sow=d=>{const x=sod(d);return addDays(x,-((x.getDay()+6)%7));};
const som=d=>new Date(d.getFullYear(),d.getMonth(),1);
const pStart=(p,d)=>p==='d'?sod(d):p==='w'?sow(d):som(d);
const isCurrent=(p,d)=>+pStart(p,d)===+pStart(p,new Date());
const isFuture=(p,d)=>+pStart(p,d)>+pStart(p,new Date());
const shift=(p,d,n)=>p==='d'?addDays(d,n):p==='w'?addDays(d,7*n):new Date(d.getFullYear(),d.getMonth()+n,1);
const docKey=(p,d)=>p==='d'?'d_'+iso(d):p==='w'?'w_'+iso(sow(d)):'m_'+iso(som(d)).slice(0,7);
const NF=new Intl.NumberFormat('tr-TR');
const fFull=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fDay=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',weekday:'long'});
const fDMl=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long'});
const fDM=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'short'});
const fMonLong=new Intl.DateTimeFormat('tr-TR',{month:'long'});
const fMonth=new Intl.DateTimeFormat('tr-TR',{month:'long',year:'numeric'});
const fMonShort=new Intl.DateTimeFormat('tr-TR',{month:'short'});
let fHijri=null; try{fHijri=new Intl.DateTimeFormat('tr-TR-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'});}catch(e){}
const pctS=f=>'%'+Math.round(f*100);

function esmaOfDay(d){ const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); const b=(((n%33)+33)%33)*3; return [b,b+1,b+2]; }
const isEsma=t=>t.unit==='esma';
const isDk=t=>t.unit==='dk';
const tgt=t=>isDk(t)?t.target*60:t.target;
const isBinary=t=>!isEsma(t)&&!isDk(t)&&t.target===1;
const capOf=(t,f)=>f.indexOf('esma_')===0?ESMA[+f.slice(5)-1][2]:tgt(t);
function mmss(s){ s=Math.floor(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x); }
function fmtMin(v){ v=Math.floor(v); if(v>=60){const h=Math.floor(v/60),m=v%60;return m?NF.format(h)+' sa '+m+' dk':NF.format(h)+' sa';} return v+' dk'; }

const STAR=(function(){const R=47,r=R*0.7654,p=[];for(let i=0;i<16;i++){const a=(-90+i*22.5)*Math.PI/180,q=i%2?r:R;p.push((50+q*Math.cos(a)).toFixed(2)+','+(50+q*Math.sin(a)).toFixed(2));}return p.join(' ');})();
const MINI='<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+STAR+'"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
const CHECKS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
function ringHTML(f,cat){ const rc='var(--c-'+(CATNAME[cat]?cat:'diger')+')';
  if(f>=0.9999) return '<span class="ring ok" style="--rc:'+rc+'" aria-hidden="true">'+CHECKS+'</span>';
  return '<span class="ring" style="--rc:'+rc+'" aria-hidden="true"><svg viewBox="0 0 40 40"><circle class="rb" cx="20" cy="20" r="16"/><circle class="rf" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="'+(100.53*(1-f)).toFixed(2)+'"/></svg><b>'+Math.round(f*100)+'</b></span>'; }
(function(){ const R=22,r=R*0.7654,p=[]; for(let i=0;i<16;i++){const a=(-90+i*22.5)*Math.PI/180,q=i%2?r:R;p.push((32+q*Math.cos(a)).toFixed(1)+','+(32+q*Math.sin(a)).toFixed(1));}
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g fill='none' stroke='#fff' stroke-width='1.3'><polygon points='"+p.join(' ')+"'/><path d='M0 32H10M54 32H64M32 0V10M32 54V64M0 0L16.5 16.5M64 0L47.5 16.5M0 64L16.5 47.5M64 64L47.5 47.5'/></g></svg>";
  const st=document.createElement('style'); st.textContent='.hero::before{background-image:url("data:image/svg+xml,'+encodeURIComponent(svg)+'")}'; document.head.appendChild(st); })();
let fHp=null; try{ fHp=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric'}); }catch(e){}
function hijri(d){ if(!fHp) return null; try{ const ps=fHp.formatToParts(d),g=t=>+((ps.find(x=>x.type===t)||{}).value); const r={day:g('day'),month:g('month')}; return r.day&&r.month?r:null; }catch(e){ return null; } }
function tipsFor(d){
  const t=[],wd=d.getDay(),h=hijri(d);
  const bayram=h&&((h.month===10&&h.day===1)||(h.month===12&&h.day>=10&&h.day<=13));
  if(bayram){ t.push(['Bayram günü','Bayram günlerinde oruç tutulmaz. Aile ziyareti ve sadaka için güzel bir gün.']); return t; }
  if(h&&h.month===9) t.push(['Ramazan','Ramazan ayındasın. Oruç, teravih ve Kur\'an tilâveti bu ayın öne çıkan ibadetleri.']);
  if(h&&h.month!==9&&h.day>=13&&h.day<=15) t.push(['Eyyâm-ı bîz','Hicrî ayın '+h.day+'. günü. Her ayın 13, 14 ve 15. günlerinde oruç tutmak sünnettir.']);
  if((wd===1||wd===4)&&!(h&&h.month===9)) t.push(['Sünnet oruç günü',(wd===1?'Pazartesi':'Perşembe')+' orucu sünnettir; haftalık oruç hedefin için uygun bir gün.']);
  if(wd===5) t.push(['Cuma','Kehf sûresi okumak ve bol salavat getirmek için güzel bir gün.']);
  if(wd===4) t.push(['Cuma gecesi','Bu akşam Cuma gecesi; salavat ve dua için değerli bir vakit.']);
  return t;
}
let starN=0;
function starHTML(withPct){ const id='sc'+(++starN); return '<span class="star"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="'+id+'"><polygon points="'+STAR+'"/></clipPath></defs><polygon points="'+STAR+'" class="s-bg"/><g clip-path="url(#'+id+')"><rect class="s-fill" x="0" y="0" width="100" height="100"/></g><polygon points="'+STAR+'" class="s-line"/></svg>'+(withPct?'<span class="pct"></span>':'')+'</span>'; }
function setStar(el,f){ if(!el) return; f=Math.max(0,Math.min(1,f)); el.querySelector('.s-fill').style.transform='translateY('+(100*(1-f)).toFixed(2)+'px)'; el.classList.toggle('full',f>=1); const p=el.querySelector('.pct'); if(p)p.textContent=pctS(f); }

/* durum */
const state={tasks:clone(DEFAULT_TASKS),members:[],prof:{},me:null,joined:false,canWrite:false,canAdmin:false,
  logs:{},aile:{},tab:'d',cursor:sod(new Date()),year:new Date().getFullYear(),view:null,filter:'all',aileP:'d',membersLoaded:false};
const store={mode:'init',db:null,user:null,pend:{},inflight:{},timers:{},writing:{},subs:{},retry:{},readOnly:false,localT:null,dl:null};
let timer=null;
try{ timer=JSON.parse(localStorage.getItem('vird:timer')||'null'); }catch(e){}
try{ const p=JSON.parse(localStorage.getItem('vird:prefs')||'{}'); if(['d','w','m','y','aile'].includes(p.tab))state.tab=p.tab; else if(PNAME[p.period])state.tab=p.period; if(p.view)state.view=p.view; if(p.filter==='left')state.filter='left'; }catch(e){}
const savePrefs=()=>{try{localStorage.setItem('vird:prefs',JSON.stringify({tab:state.tab,view:state.view,filter:state.filter}));}catch(e){}};
const saveTimer=()=>{try{ timer?localStorage.setItem('vird:timer',JSON.stringify(timer)):localStorage.removeItem('vird:timer'); }catch(e){}};
const period=()=>PNAME[state.tab]?state.tab:'d';

function normTasks(ts){
  if(!Array.isArray(ts)) return null;
  return ts.filter(t=>t&&t.id&&t.name&&PNAME[t.period]).map(t=>{ const x=Object.assign({},t);
    if(x.id==='esma'){x.unit='esma';x.target=3;}
    x.target=Math.max(1,parseInt(x.target,10)||1); if(x.scope!=='aile')x.scope='kisi';
    if(!CATNAME[x.cat]) x.cat=CATMAP[x.id]||'diger'; return x; });
}
const ownerKey=(t,u)=>t.scope==='aile'?'aile':u;
function valsOf(t,u,k){ if(t.scope==='aile') return state.aile[k]||{}; const L=state.logs[u]; return (L&&L[k])||{}; }
const timerOn=(t,u,k,f)=>!!(timer&&timer.tid===t.id&&timer.k===k&&timer.owner===ownerKey(t,u)&&timer.f===f);
const timerVal=()=>timer.base+(Date.now()-timer.start)/1000;
function val(t,u,k,f){ f=f||t.id; let v=+valsOf(t,u,k)[f]||0; if(timerOn(t,u,k,f)) v=Math.min(capOf(t,f),timerVal()); return v; }
function frac(t,u,k,date){
  if(isEsma(t)){ let s=0; for(const i of esmaOfDay(date)) s+=Math.min(1,val(t,u,k,'esma_'+(i+1))/ESMA[i][2]); return s/3; }
  return Math.min(1,val(t,u,k)/tgt(t));
}
function amount(t,u,k){ if(isEsma(t)){ let s=0; const v=valsOf(t,u,k); for(const f in v) if(f.indexOf('esma_')===0) s+=+v[f]||0; return s; } return val(t,u,k); }
function comp(u,p,d){
  const ts=state.tasks.filter(t=>t.period===p); if(!ts.length||!u) return {pct:0,done:0,total:0};
  const k=docKey(p,d); let s=0,done=0;
  for(const t of ts){ const f=frac(t,u,k,d); s+=f; if(f>=0.9999)done++; }
  return {pct:s/ts.length,done,total:ts.length};
}
function streak(u){ let d=sod(new Date()),n=0; if(comp(u,'d',d).pct<0.9999)d=addDays(d,-1); for(let i=0;i<800;i++){ if(comp(u,'d',d).pct>=0.9999){n++;d=addDays(d,-1);}else break; } return n; }
function sinceFor(u){
  const m=state.members.find(x=>x.id===u); let s=m&&m.since?sod(new Date(m.since)):null;
  const L=state.logs[u]||{}; for(const k in L) if(k[0]==='d'){ const d=parseIso(k.slice(2)); if(!s||d<s) s=d; }
  return s||sod(new Date());
}
/* yıllık hesap */
const yCache={};
function yearStats(u,y){
  const ck=u+'|'+y; if(yCache[ck]) return yCache[ck];
  const today=sod(new Date()); let start=new Date(y,0,1),end=new Date(y,11,31);
  const s=sinceFor(u); if(s>start) start=s; if(today<end) end=today;
  const R={y,start,end,empty:start>end,heat:{},tasks:{},months:Array.from({length:12},()=>({s:0,n:0})),sum:0,n:0,fullDays:0,longest:0};
  if(R.empty) return yCache[ck]=R;
  for(const t of state.tasks) R.tasks[t.id]={t,done:0,n:0,fs:0,amt:0};
  const add=(p,d)=>{ const k=docKey(p,d); let ds=0,dn=0;
    for(const t of state.tasks){ if(t.period!==p) continue; const f=frac(t,u,k,d),st=R.tasks[t.id]; st.n++; st.fs+=f; if(f>=0.9999)st.done++; st.amt+=amount(t,u,k); ds+=f; dn++; R.sum+=f; R.n++; const mo=R.months[d.getMonth()]; mo.s+=f; mo.n++; }
    return dn?ds/dn:null; };
  let run=0;
  for(let d=new Date(start);d<=end;d=addDays(d,1)){ const pc=add('d',d); R.heat[iso(d)]=pc==null?0:pc; if(pc!=null&&pc>=0.9999){R.fullDays++;run++;if(run>R.longest)R.longest=run;} else run=0; }
  for(let w=sow(start);w<=end;w=addDays(w,7)){ if(w.getFullYear()<y&&addDays(w,6).getFullYear()<y) continue; add('w',w<start&&w.getFullYear()<y?new Date(y,0,1):w); }
  for(let m=som(start);m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1)) add('m',m);
  R.pct=R.n?R.sum/R.n:0;
  return yCache[ck]=R;
}

async function scheduleReminders(ask){

    const pend=await LN.getPending(); if(pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});

    b+='<button class="btn ghost" data-z="manual" aria-expanded="'+csManual+'">Elle gir</button>';
    b+='<button class="btn ghost" data-z="reset"'+(I.v<=0?' disabled':'')+'>Sıfırla</button>';
    if(nx!=null) b+='<button class="btn plus" data-z="next" data-i="'+nx+'">Sıradaki: '+esc(ESMA[nx][0])+'</button>'; else if(I.done) b+='<button class="btn plus" data-z="close">Bitir</button>';
    if(csManual) b+='<div class="z-manual" style="flex-basis:100%;justify-content:center"><input type="number" id="zIn" min="0" inputmode="numeric" aria-label="'+(I.dk?'Dakika':'Sayı')+'" placeholder="'+(I.dk?'dakika':'sayı')+'"><button class="btn plus" data-z="setm">Kaydet</button></div>';
    $('zBottom').innerHTML=b; if(csManual){ const zi=$('zIn'); zi.value=I.dk?Math.floor(I.v/60):Math.floor(I.v); zi.focus(); zi.select(); } }
}
$('zTap').addEventListener('click',()=>{
  if(!cs) return; const I=csInfo(); if(!I||I.done) return;
  if(I.dk){ if(I.run) stopTimer(); else startTimer(I.t,cs.u,cs.k); return; }
  const v=Math.floor(I.v)+1; setVal(I.t,cs.u,cs.k,I.f,v); if(v>=I.T){ buzz([30,60,30]); bloom(); } else buzz(8); render();
});
$('zBottom').addEventListener('click',e=>{
  const b=e.target.closest('[data-z]'); if(!b||!cs) return; const I=csInfo(); if(!I) return; const a=b.dataset.z;
  const set=n=>{ if(timerOn(I.t,cs.u,cs.k,I.f)){ timer=null; saveTimer(); } setVal(I.t,cs.u,cs.k,I.f,n); render(); };
  if(a==='undo') set(Math.floor(I.v)-1);
  else if(a==='m5') set(I.v-300);
  else if(a==='p5'){ set(I.v+300); if(I.v+300>=I.T){ buzz([30,60,30]); bloom(); } }
  else if(a==='tg'){ if(I.run) stopTimer(); else startTimer(I.t,cs.u,cs.k); }
  else if(a==='reset') armConfirm(b,'Emin misin?',()=>set(0));
  else if(a==='add'){ const v=Math.min(I.T,Math.floor(I.v)+(+b.dataset.n)); set(v); if(v>=I.T){ buzz([30,60,30]); bloom(); } else buzz(12); }
  else if(a==='manual'){ csManual=!csManual; csSig=''; renderCounter(); }
  else if(a==='setm'){ const raw=parseInt($('zIn').value,10); if(isNaN(raw)||raw<0){ toast('Geçerli bir sayı yaz.'); return; } const v=I.dk?raw*60:raw; csManual=false; csSig=''; set(v); if(Math.min(v,I.T)>=I.T){ buzz([30,60,30]); bloom(); } }
  else if(a==='next'){ cs.ei=+b.dataset.i; csSig=''; $('zikir').classList.remove('complete'); renderCounter(); $('zTap').focus(); }
  else if(a==='close') closeCounter();
});
$('zClose').addEventListener('click',closeCounter);
function armConfirm(btn,label,fn){
  if(btn.dataset.armed==='1'){ clearTimeout(btn._t); btn.dataset.armed=''; btn.textContent=btn.dataset.orig; fn(); return; }
  btn.dataset.orig=btn.textContent; btn.dataset.armed='1'; btn.textContent=label; btn._t=setTimeout(()=>{ btn.dataset.armed=''; btn.textContent=btn.dataset.orig; },3000);
}

/* etkileşim */
$('joinBox').addEventListener('click',async e=>{
  if(e.target.closest('#swYes')){ const t=state.switchInv; if(t) switchFamily(t); return; }
  if(e.target.closest('#swNo')){ state.switchInv=null; render(); return; }
  const name=()=>(($('joinName')||{}).value||'').trim().slice(0,30);
  if(e.target.closest('#startBtn')){ const n=name(); if(!n){ toast('Adını yaz.'); $('joinName').focus(); return; } e.target.closest('#startBtn').disabled=true; try{ await createFamily(n); toast('Hoş geldin, '+n+'.'); }catch(err){ console.warn(err); toast('Başlatılamadı. İnternetini kontrol et.'); render(); } return; }
  if(e.target.closest('#invBtn')){ const t=tokenOf(($('invIn').value||'').trim()); if(!t){ toast('Geçerli bir davet linki yapıştır.'); return; } await startJoin(t); return; }
  const pk=e.target.closest('[data-pick]');
  if(pk){ try{ await pickMember(pk.dataset.pick); toast('Hoş geldin, '+dname(pk.dataset.pick)+'.'); }catch(err){ toast('Seçilemedi. İnternetini kontrol et.'); } return; }
  if(e.target.closest('#joinBtn')){ const n=name(); if(!n){ toast('Adını yaz.'); $('joinName').focus(); return; } try{ await addSelf(n); toast('Hoş geldin, '+n+'.'); }catch(err){ toast('Eklenemedi. İnternetini kontrol et.'); } }
});
$('joinBox').addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const b=e.target.id==='invIn'?$('invBtn'):($('startBtn')||$('joinBtn')); if(b){ e.preventDefault(); b.click(); } });
$('people').addEventListener('click',e=>{ const b=e.target.closest('[data-mid]'); if(!b)return; state.view=b.dataset.mid; savePrefs(); render(); });
$('tabbar').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b)return; const was=state.tab; state.tab=b.dataset.tab; if(was!==state.tab||PNAME[state.tab]) { if(PNAME[state.tab]) state.cursor=sod(new Date()); if(state.tab==='y'&&was!=='y') state.year=new Date().getFullYear(); } savePrefs(); render(); window.scrollTo(0,0); });
$('view').addEventListener('toggle',e=>{ if(e.target.id==='esmaAll') esmaOpen=e.target.open; },true);
$('view').addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){ const n=+nav.dataset.nav;
    if(state.tab==='y'){ const y=state.year+n; if(y<=new Date().getFullYear()){ state.year=y; render(); } }
    else { const p=period(),c=shift(p,state.cursor,n); if(!isFuture(p,c)){ state.cursor=c; render(); } }
    return; }
  if(e.target.closest('[data-today]')){ if(state.tab==='y') state.year=new Date().getFullYear(); else state.cursor=sod(new Date()); render(); return; }
  const ab=e.target.closest('[data-aile]');
  if(ab){ if(ab.dataset.aile==='invite') sendInvite(); else { const n=(($('addName')||{}).value||'').trim().slice(0,30); if(!n){ toast('Bir ad yaz.'); return; } famRef.collection('members').doc().set({name:n,since:Date.now(),managed:true}).catch(()=>toast('Eklenemedi.')); toast(n+' eklendi.'); $('addName').value=''; } return; }
  const fb=e.target.closest('[data-filter]'); if(fb){ state.filter=fb.dataset.filter; savePrefs(); render(); return; }
  const ap=e.target.closest('[data-ap]'); if(ap){ state.aileP=ap.dataset.ap; render(); return; }
  const hc=e.target.closest('.hc[data-t]'); if(hc){ state.tab='d'; state.cursor=parseIso(hc.dataset.t); savePrefs(); render(); window.scrollTo(0,0); return; }
  const hb=e.target.closest('.h-col[data-t]'); if(hb&&!hb.disabled){ state.cursor=parseIso(hb.dataset.t); render(); return; }
  const b=e.target.closest('[data-act]'),li=e.target.closest('li.task'); if(!b||!li) return;
  const t=state.tasks.find(x=>x.id===li.dataset.id); if(!t) return;
  const u=state.view,k=docKey(period(),state.cursor),a=b.dataset.act;
  if(a==='open') openCounter(t.id,li.dataset.ei);
  else if(a==='toggle'){ setVal(t,u,k,t.id,val(t,u,k)>=1?0:1); render(); }
  else if(a==='inc'){ const v=Math.floor(val(t,u,k))+1; setVal(t,u,k,t.id,v); if(v>=tgt(t)) buzz([30,60,30]); render(); }
  else if(a==='dec'){ setVal(t,u,k,t.id,Math.floor(val(t,u,k))-1); render(); }
  else if(a==='timer'){ if(timerOn(t,u,k,t.id)) stopTimer(); else startTimer(t,u,k); }
});

/* ayarlar */
let draft=null,sPrev=null;
function openSettings(){ draft={tasks:clone(state.tasks),members:state.members.map(m=>({id:m.id,name:m.nick})),rem:clone(REM)}; sPrev=document.activeElement; renderSheet(); $('sheet').hidden=false; $('sheetBg').hidden=false; document.body.style.overflow='hidden'; $('sheetX').focus(); }
function closeSettings(){ draft=null; $('sheet').hidden=true; $('sheetBg').hidden=true; document.body.style.overflow=''; if(sPrev&&document.contains(sPrev)) sPrev.focus(); }
function taskEditor(t,i){
  const es=isEsma(t);
  return '<li class="ed-t"><input type="text" class="ed-name" value="'+esc(t.name)+'" data-ti="'+i+'" data-f="name" placeholder="Görev adı" aria-label="Görev adı">'+
    '<div class="ed-row">'+(es?'<span class="ed-note" style="margin:0">Her gün 3 isim</span>':
    '<label>Hedef <input type="number" min="1" inputmode="numeric" value="'+esc(t.target)+'" data-ti="'+i+'" data-f="target"></label><select data-ti="'+i+'" data-f="unit" aria-label="Birim">'+UNITS.map(x=>'<option value="'+x[0]+'"'+(x[0]===t.unit?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>')+
    '<select data-ti="'+i+'" data-f="cat" aria-label="Kategori">'+CATS.map(c=>'<option value="'+c[0]+'"'+(c[0]===t.cat?' selected':'')+'>'+c[1]+'</option>').join('')+'</select>'+
    (es?'':'<label><input type="checkbox" data-ti="'+i+'" data-f="aile"'+(t.scope==='aile'?' checked':'')+'> Ailece</label>')+
    '<button class="btn ghost push" data-act="delt" data-ti="'+i+'" aria-label="'+esc(t.name||'Görev')+' görevini sil">Sil</button></div></li>';
}
const hm=r=>pad(r.h)+':'+pad(r.m);
function renderSheet(focusSel){
  let h='<h3>Aileyi davet et</h3><button class="btn plus" data-act="invite">Davet linki gönder</button><p class="ed-note">WhatsApp veya istediğin uygulamayla gönder. Link 30 gün geçerli; linke dokunan kişi aileye katılır.</p>';
  h+='<h3>Bildirimler</h3>'+(state.notif&&state.notif!=='granted'?'<p class="err">'+(state.notif==='yok'?'Bildirimler sadece Android uygulamasında çalışır.':'Bildirim izni kapalı. Aşağıdan izin ver ya da telefon ayarlarından aç.')+'</p>'+(state.notif!=='yok'?'<p><button class="btn" data-act="perm">Bildirim izni ver</button></p>':''):'')+
    '<div>'+draft.rem.map((r,i)=>'<div class="rem"><label><input type="checkbox" data-ri="'+i+'" data-f="en"'+(r.en?' checked':'')+'><span>'+esc(r.t)+'<small>'+esc(remDays(r))+'</small></span></label><input type="time" value="'+hm(r)+'" data-ri="'+i+'" data-f="time" aria-label="'+esc(r.t)+' saati"></div>').join('')+'</div><p class="ed-note">Bildirim saatleri sadece bu telefon için geçerlidir.</p>';
  h+='<h3>Aile üyeleri</h3><ul class="ed-list">'+draft.members.map((m,i)=>'<li class="ed-t"><input type="text" class="ed-name" value="'+esc(m.name)+'" data-mi="'+i+'" maxlength="30" aria-label="Ad"><div class="ed-row">'+(m.id===ME?'<span class="small muted">sen</span>':'<button class="btn ghost danger push" data-act="kick" data-mi="'+i+'">Çıkar</button>')+'</div></li>').join('')+'</ul>';
  for(const p of ['d','w','m']) h+='<h3>'+PNAME[p]+' görevler</h3><ul class="ed-list">'+draft.tasks.map((t,i)=>[t,i]).filter(x=>x[0].period===p).map(x=>taskEditor(x[0],x[1])).join('')+'</ul><button class="link" data-act="addt" data-p="'+p+'">Görev ekle</button>';
  h+='<p class="ed-note">Görev listesi tüm aile için ortaktır. “Ailece” görevler tek kayıttır, kim işaretlerse herkeste görünür.</p><p><button class="btn ghost danger" data-act="reset">Varsayılan görev listesine dön</button></p>';
  h+='<h3>Başka aileye katıl</h3><div class="join-row"><input type="text" id="swIn" placeholder="Davet linkini yapıştır" aria-label="Davet linki"><button class="btn" data-act="swjoin">Katıl</button></div>';
  h+='<h3>Bu telefon</h3><div class="ed-row"><button class="btn" data-act="switch">Kişiyi değiştir</button><button class="btn ghost danger" data-act="wipe">Verilerimi sil</button></div><p class="ed-note">“Verilerimi sil” senin kayıtlarını ve bu telefonun aile bağlantısını kalıcı olarak siler.</p>';
  h+='<p class="ed-note">Vird sürüm 1.0.'+(BUILD||0)+(state.update?' · yeni sürüm: 1.0.'+state.update:'')+'</p>';
  $('sheetBody').innerHTML=h;
  if(focusSel){ const el=$('sheetBody').querySelector(focusSel); if(el) el.focus(); }
}
function onDraft(e){
  const el=e.target; if(!draft) return;
  if(el.dataset.ri!==undefined){ const r=draft.rem[+el.dataset.ri]; if(!r) return; if(el.dataset.f==='en') r.en=el.checked; else { const a=String(el.value||'').split(':').map(Number); if(a.length===2&&!isNaN(a[0])&&!isNaN(a[1])){ r.h=a[0]; r.m=a[1]; } } return; }
  if(el.dataset.mi!==undefined){ const m=draft.members[+el.dataset.mi]; if(m) m.name=el.value; return; }
  if(el.dataset.ti!==undefined){ const t=draft.tasks[+el.dataset.ti]; if(!t) return; const f=el.dataset.f;
    if(f==='name')t.name=el.value; else if(f==='target')t.target=el.value; else if(f==='unit')t.unit=el.value; else if(f==='cat')t.cat=el.value; else if(f==='aile')t.scope=el.checked?'aile':'kisi'; }
}
$('sheetBody').addEventListener('input',onDraft);
$('sheetBody').addEventListener('change',onDraft);
$('sheetBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||!draft) return; const a=b.dataset.act;
  if(a==='invite') sendInvite();
  else if(a==='swjoin'){ const t=tokenOf(($('swIn').value||'').trim()); if(!t){ toast('Geçerli bir davet linki yapıştır.'); return; } closeSettings(); offerSwitch(t); }
  else if(a==='perm') scheduleReminders(true).then(()=>{ if(draft) renderSheet(); });
  else if(a==='addt'){ draft.tasks.push({id:uid('t'),name:'',period:b.dataset.p,target:1,unit:'kez',scope:'kisi',cat:'diger'}); renderSheet('[data-ti="'+(draft.tasks.length-1)+'"][data-f="name"]'); }
  else if(a==='delt'){ draft.tasks.splice(+b.dataset.ti,1); renderSheet(); }
  else if(a==='reset') armConfirm(b,'Emin misin? Tekrar dokun',()=>{ draft.tasks=clone(DEFAULT_TASKS); renderSheet(); });
  else if(a==='kick') armConfirm(b,'Emin misin?',()=>{ draft.members.splice(+b.dataset.mi,1); renderSheet(); });
  else if(a==='switch'){ closeSettings(); famRef.collection('devices').doc(UID).set({mid:''},{merge:true}).catch(()=>{}); ME=''; lsSet('vird:me',null); afterMembers(); render(); }
  else if(a==='wipe') armConfirm(b,'Kalıcı olarak silinsin mi? Tekrar dokun',()=>{ closeSettings(); deleteMyData(); });
});
$('sheetSave').addEventListener('click',async()=>{
  if(!draft) return; const d=draft; closeSettings();
  REM=d.rem; remSave(); scheduleReminders(false);
  const ts=normTasks(d.tasks.map(t=>Object.assign({},t,{name:String(t.name).trim()})));
  const changedT=JSON.stringify(ts)!==JSON.stringify(state.tasks);
  const mems=d.members.map(m=>({id:m.id,name:String(m.name||'').trim().slice(0,30)})).filter(m=>m.name);
  const removed=state.members.filter(m=>!mems.some(x=>x.id===m.id)&&m.id!==ME).map(m=>m.id);
  const changedM=mems.filter(m=>{ const o=state.members.find(x=>x.id===m.id); return o&&o.nick!==m.name; });
  if(!famRef){ toast('Kaydedildi.'); return; }
  try{
    const b=db.batch(); let n=0;
    if(changedT){ state.tasks=ts; b.set(famRef,{tasks:clone(ts)},{merge:true}); n++; }
    for(const m of changedM){ b.set(famRef.collection('members').doc(m.id),{name:m.name},{merge:true}); n++; }
    for(const id of removed){ b.delete(famRef.collection('members').doc(id)); n++; }
    if(n) b.commit().catch(e=>{ console.warn(e); toast('Ayarlar gönderilemedi.'); });
    render(); toast('Kaydedildi.');
  }catch(e){ toast('Kaydedilemedi.'); }
});
$('sheetCancel').addEventListener('click',closeSettings);
$('sheetX').addEventListener('click',closeSettings);
$('sheetBg').addEventListener('click',closeSettings);
$('btnSettings').addEventListener('click',openSettings);
$('zBottom').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='zIn'){ e.preventDefault(); const b=$('zBottom').querySelector('[data-z="setm"]'); if(b) b.click(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('sheet').hidden) closeSettings(); else if(cs) closeCounter(); } });

init();
})();
</script>
