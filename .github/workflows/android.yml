name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Android projesi
        run: |
          npx cap add android
          node scripts/android-setup.js
          npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../vird.apk

      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Vird 1.0.${{ github.run_number }}" --notes "Otomatik derleme" --latest
          gh release edit latest --title "Vird 1.0.${{ github.run_number }}" --latest
          gh release upload latest vird.apk --clobber
